name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Determine version bump type from PR labels
  check-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.check-labels.outputs.release_type }}
      should_release: ${{ steps.check-labels.outputs.should_release }}
    steps:
      - name: Check PR labels for release type
        id: check-labels
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "PR Labels: $PR_LABELS"

          if echo "$PR_LABELS" | grep -q "major_release"; then
            echo "release_type=major" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif echo "$PR_LABELS" | grep -q "minor_release"; then
            echo "release_type=minor" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif echo "$PR_LABELS" | grep -q "patch_release"; then
            echo "release_type=patch" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=none" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No release label found. Skipping release."
          fi

  # Bump plugin.json version, commit it on main, and tag the commit
  release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      previous_version: ${{ steps.bump.outputs.previous_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump plugin version
        id: bump
        env:
          RELEASE_TYPE: ${{ needs.check-release.outputs.release_type }}
        run: |
          python3 .github/scripts/bump_version.py "$RELEASE_TYPE"

      - name: Commit and tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/llm-wiki-for-code/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"

  # Create GitHub Release
  create-github-release:
    needs: [check-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_version }}
          fetch-depth: 0

      - name: Package plugin
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="llm-wiki-for-code-${NEW_VERSION}/" \
            -o "dist/llm-wiki-for-code-plugin-${NEW_VERSION}.tar.gz" \
            "v${NEW_VERSION}" plugins/llm-wiki-for-code .claude-plugin

      - name: Generate release notes
        id: release-notes
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
          RELEASE_TYPE: ${{ needs.check-release.outputs.release_type }}
          REPO: ${{ github.repository }}
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "v${NEW_VERSION}^" 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..v${NEW_VERSION}" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          # Create release notes
          cat << EOF > release_notes.md
          ## What's Changed

          $COMMITS

          ## Install

          \`\`\`
          /plugin marketplace add ${REPO}
          /plugin install llm-wiki-for-code@fedelemantuano-claude-plugins
          \`\`\`

          Already installed? Update with \`/plugin marketplace update fedelemantuano-claude-plugins\`
          then \`claude plugin update llm-wiki-for-code\`.

          Release type: \`${RELEASE_TYPE}\` — plugin version \`${NEW_VERSION}\`.

          ## Full Changelog

          **Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG:-initial}...v${NEW_VERSION}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_version }}
          name: Release v${{ needs.release.outputs.new_version }}
          body_path: release_notes.md
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
